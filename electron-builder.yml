# Installers for Windows, macOS and Linux. `npm run dist` builds for the current OS.
#
# Signing is driven by the environment and skipped when nothing is set:
#   Windows, certificate file: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD (CSC_LINK / CSC_KEY_PASSWORD
#     also work locally; the release workflow passes only the WIN_ ones on Windows)
#   Windows, Azure Artifact Signing (formerly Trusted Signing, the signing Microsoft recommends
#     for Smart App Control): when AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET are set,
#     .github/workflows/release.yml adds
#       -c.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER
#       -c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT
#       -c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT
#       -c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE
#     (a YAML file cannot make azureSignOptions conditional, and setting it without credentials
#     would fail every unsigned local build)
#   With either, the workflow also passes -c.forceCodeSigning=true and signs the NSIS plug-in
#   DLLs (see release.yml), then scripts/check-blocks.ps1 fails the release if anything that
#   Smart App Control evaluates is left unsigned (docs/BLOCK-TEST.md).
#   macOS: CSC_LINK + CSC_KEY_PASSWORD for signing; APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
#     APPLE_TEAM_ID for notarisation
# `signExts` only matters when a certificate is present; unsigned builds sign nothing.

appId: io.github.agentrunmonitor
productName: Agent Run Monitor
copyright: Copyright © 2026 Agent Run Monitor contributors

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.map"

# No native modules and no unpacked files: SQLite comes from Node's built-in node:sqlite.
asar: true

forceCodeSigning: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # electron-builder signs only .exe by default. Smart App Control checks every DLL the app loads
  # (Electron ships ffmpeg.dll, dxcompiler.dll, vulkan-1.dll... unsigned) and native .node modules
  # are DLLs too, so sign both. d3dcompiler_47.dll is re-signed with our certificate, which is fine.
  signExts: [".dll", ".node"]
  artifactName: agent-run-monitor-${version}-win-${arch}.${ext}

nsis:
  # Per-user install, never asks for administrator rights. oneClick installs into the user's
  # profile without an install-mode page (an assisted installer with perMachine false would
  # offer an "all users" choice that needs elevation).
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agent Run Monitor
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # Installs to %LOCALAPPDATA%\Programs\agent-run-monitor (a one-click per-user install names the
  # folder after the package name, not productName).
  # One installer per architecture only: the combined x64 + arm64 setup.exe is not built, so every
  # published installer is one that scripts/check-blocks.ps1 audits in the release workflow.
  buildUniversalInstaller: false
  # build/installer.nsh: the uninstaller also removes %LOCALAPPDATA%\agent-run-monitor-updater
  # (electron-builder's copy of the installer, unused because the app has no auto-updater).
  include: build/installer.nsh
  artifactName: agent-run-monitor-${version}-setup-${arch}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: agent-run-monitor-${version}-mac-${arch}.${ext}

dmg:
  artifactName: agent-run-monitor-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Development
  synopsis: Watch your coding-agent runs, locally and read-only
  maintainer: Agent Run Monitor contributors <agent-run-monitor@users.noreply.github.com>
  target:
    - AppImage
    - deb
  artifactName: agent-run-monitor-${version}-linux-${arch}.${ext}

# Owner and repo come from package.json "repository" (currently PastFumbler/agent-run-monitor);
# `npm run set-repo -- <owner>/<repo>` rewrites that, so nothing here needs editing.
publish:
  provider: github
  releaseType: draft
