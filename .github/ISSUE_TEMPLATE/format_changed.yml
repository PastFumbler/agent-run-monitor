name: Format changed
description: Runs from an agent show "couldn't read this run", or look wrong, after the agent was updated.
title: "[Format]: "
labels: ["format changed"]
body:
  - type: markdown
    attributes:
      value: |
        Agents change how they store sessions from time to time. When that happens the app shows the affected runs as "couldn't read this run", or shows them with missing parts, instead of crashing. This report helps us update the adapter.

        **Structure only, please.** Don't paste session contents or attach session files: they may contain your code, file paths and secrets. Describe record types, field names and nesting, with every value replaced by a placeholder such as `<string>`, `<number>` or `<timestamp>`.
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Qwen Code
        - Copilot (VS Code)
        - Copilot CLI
        - Aider
        - Cursor
        - Cline
        - Roo Code
        - Continue
        - OpenCode
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      description: The version that produces the new format, and the last version that worked if you know it.
      placeholder: 2.5.0 (worked with 2.4.3)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Agent Run Monitor version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error text shown
      description: The exact message on the run (for example "No records this app recognises; the agent may have changed its format."), or describe what is missing or wrong.
      render: text
    validations:
      required: true
  - type: textarea
    id: structure
    attributes:
      label: New structure, with all contents removed
      description: |
        The file or folder layout, and the record types or fields that are new or changed. Replace every value with a placeholder. A few representative records are enough.
      render: text
      placeholder: |
        sessions/<date>/<session-id>.jsonl

        {"type": "turn_end", "payload": {"status": "<string>", "usage": {"input": <number>, "output": <number>}}}
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have removed all session contents, code, secrets and private paths from this report.
          required: true
